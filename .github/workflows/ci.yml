name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, secrets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnivate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnivate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/omnivate
      DATABASE_URL: postgres://omnivate_app:omnivate_local_dev_only@localhost:5432/omnivate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate empty PostgreSQL database
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Phone shell
        run: pnpm phone:smoke

      - name: Secret scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose
