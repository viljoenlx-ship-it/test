<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        var phoneMax = 767;
        var cap = 1040;
        function pos(n) {
          return n > 0 ? n : 1e9;
        }
        var layout = Math.min(
          pos(window.innerWidth),
          pos(document.documentElement.clientWidth),
          pos(window.visualViewport && window.visualViewport.width),
        );
        var shortSide = Math.min(pos(screen.width), pos(screen.height));
        var ua = navigator.userAgent || '';
        var uaPhone = /iPhone|iPod|Android.+Mobile|Windows Phone|IEMobile|Opera Mini/.test(ua);
        var touch =
          (navigator.maxTouchPoints || 0) > 0 ||
          (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        var phone =
          layout <= phoneMax || (layout <= cap && (uaPhone || (touch && shortSide <= phoneMax)));
        document.documentElement.dataset.shell = phone ? 'phone' : 'desk';
      })();
    </script>
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#4020a0" />
    <title>Omnivate Control</title>
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%BASE_URL%favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
