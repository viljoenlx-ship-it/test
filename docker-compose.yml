services:
  postgres:
    image: postgres:16
    container_name: omnivate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnivate
    ports:
      - '5432:5432'
    volumes:
      - omnivate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d omnivate']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  omnivate-postgres:
